[package]
name = "orbit-natif"
version = "0.1.0"
edition = "2021"
description = "Orbit — client de bureau natif, sans moteur web"

[lib]
name = "orbit_natif"
path = "src/lib.rs"

[[bin]]
name = "orbit-natif"
path = "src/main.rs"

[dependencies]
slint = "1.17"

# Client HTTP. `rustls` plutot qu'OpenSSL : aucune bibliotheque systeme a
# installer, et la compilation ne depend pas de ce qui traine sur la machine.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Emplacement des donnees de l'application, selon les conventions du systeme.
directories = "5"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
