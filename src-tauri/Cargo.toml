[package]
name = "orbit"
version = "0.1.0"
description = "Orbit - discussion d'equipe en temps reel"
edition = "2021"
rust-version = "1.77"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"

# Win32 sert a deux choses : masquer la fenetre technique du greffon d'instance
# unique, et surtout enumerer les fenetres partageables avec leur vignette —
# de quoi proposer notre propre selecteur de partage plutot que celui du moteur
# web, qu'aucune page ne peut remplacer.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[profile.release]
# Taille du binaire plutot que vitesse brute : l'application passe son temps a
# attendre le reseau, pas a calculer.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
